name: Assemble deployable site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync PNG favicons from live site and remove one-shot workflow
        run: |
          set -euo pipefail
          mkdir -p images
          curl -fsSL -o images/favicon.png https://qcsmallbusiness.com/images/favicon.png
          curl -fsSL -o images/favicon-32.png https://qcsmallbusiness.com/images/favicon-32.png
          curl -fsSL -o images/apple-touch-icon.png https://qcsmallbusiness.com/images/apple-touch-icon.png
          file images/*.png
          # Remove this one-shot workflow after assets land
          rm -f .github/workflows/assemble-site.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          # Final sanity on monoliths
          head -c 15 index.html | grep -q '<!DOCTYPE'
          grep -q 'hub-ring' index.html
          grep -q 'hub-ring' styles.css
          grep -q '#f5e6c8' styles.css
      - name: Commit favicons and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add PNG favicons; remove one-shot assemble workflow"
          git pull --rebase origin main
          git push origin HEAD:main
